name: Build Android
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - name: Create Android project
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Add google-services.json
        env: { GSJ: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
        run: |
          if [ -n "$GSJ" ]; then echo "$GSJ" > android/app/google-services.json; else echo "WARNING: no GOOGLE_SERVICES_JSON secret"; fi
      - name: Restore keystore
        env: { KSB: "${{ secrets.KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KSB" ]; then echo "$KSB" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "KS_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV; fi
      - name: Patch android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: node scripts/patch-android.js
      - name: Build
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$KS_FILE" ]; then ./gradlew assembleRelease bundleRelease; else ./gradlew assembleDebug; fi
      - uses: actions/upload-artifact@v4
        with:
          name: noor-go-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
