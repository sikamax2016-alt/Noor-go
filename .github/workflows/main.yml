name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare fixed debug keystore
        run: |
          mkdir -p keystore ~/.android
          if [ ! -f keystore/debug.keystore ]; then
            keytool -genkeypair -keystore keystore/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -f keystore/debug.keystore
            git commit -m "Add fixed debug keystore"
            git push
          fi
          cp keystore/debug.keystore ~/.android/debug.keystore
          echo "### Fingerprints" >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore keystore/debug.keystore \
            -storepass android -alias androiddebugkey \
            | grep -E "SHA1|SHA256" >> $GITHUB_STEP_SUMMARY

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm install; fi

      - name: Build web assets
        run: npm run build --if-present

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Copy google-services.json
        run: |
          if [ ! -f google-services.json ]; then
            echo "ERROR: google-services.json is missing from repo root"
            exit 1
          fi
          cp google-services.json android/app/google-services.json
          echo "google-services.json copied OK" >> $GITHUB_STEP_SUMMARY

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
