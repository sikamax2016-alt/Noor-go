name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble project from flat uploads
        run: |
          mkdir -p www/icons scripts keystore
          for f in index.html backend.js rides.js native.js sw.js firebase-config.js manifest.webmanifest; do
            if [ -f "$f" ]; then cp -f "$f" "www/$f"; echo "copied $f -> www/$f" >> $GITHUB_STEP_SUMMARY; fi
          done
          for f in apple-touch-icon.png icon-192.png icon-512.png maskable-512.png; do
            if [ -f "$f" ]; then cp -f "$f" "www/icons/$f"; fi
          done
          if [ -f patch-android.js ]; then cp -f patch-android.js scripts/patch-android.js; fi
          if [ -f debug.keystore ] && [ ! -f keystore/debug.keystore ]; then cp debug.keystore keystore/debug.keystore; fi

      - name: Verify web files
        run: |
          echo "### Web files check" >> $GITHUB_STEP_SUMMARY
          ls -la www >> $GITHUB_STEP_SUMMARY
          SIZE=$(wc -c < www/index.html)
          echo "www/index.html size: $SIZE bytes" >> $GITHUB_STEP_SUMMARY
          ls index.html 2>/dev/null && echo "WARNING: stray index.html in repo root (ignored by the app)" >> $GITHUB_STEP_SUMMARY || true
          if [ "$SIZE" -lt 100000 ] || ! grep -q "BUILD-1124-A" www/index.html; then
            echo "ERROR: index.html is not the newest full app (size=$SIZE). Upload the newest index.html (the one containing BUILD-1124-A) to the repository root, replacing the old one." | tee -a $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare fixed debug keystore
        run: |
          mkdir -p keystore ~/.android
          if [ ! -f keystore/debug.keystore ]; then
            keytool -genkeypair -keystore keystore/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -f keystore/debug.keystore
            git commit -m "Add fixed debug keystore"
            git push
          fi
          cp keystore/debug.keystore ~/.android/debug.keystore
          echo "### Fingerprints" >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore keystore/debug.keystore \
            -storepass android -alias androiddebugkey \
            | grep -E "SHA1|SHA256" >> $GITHUB_STEP_SUMMARY

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm install; fi

      - name: Build web assets
        run: npm run build --if-present

      - name: Bundle native bridge
        run: |
          test -f native-src.js || { echo "ERROR: native-src.js is missing from the repo root"; exit 1; }
          npm run bundle:native
          echo "native bundle: $(wc -c < www/native.js) bytes" >> $GITHUB_STEP_SUMMARY

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Apply Noor Go Android launcher icon
        run: |
          test -d android-icons || { echo "ERROR: android-icons is missing"; exit 1; }
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f "android-icons/mipmap-$density/ic_launcher.png" || exit 1
            cp -f android-icons/mipmap-$density/ic_launcher*.png "android/app/src/main/res/mipmap-$density/"
          done

          npx cap sync android

      - name: Verify copied assets
        run: |
          F=android/app/src/main/assets/public/index.html
          echo "android assets index.html: $(wc -c < $F) bytes" >> $GITHUB_STEP_SUMMARY
          grep -q "BUILD-1124-A" $F || { echo "ERROR: build stamp missing in android assets"; exit 1; }

      - name: Copy google-services.json
        run: |
          if [ ! -f google-services.json ]; then
            echo "ERROR: google-services.json is missing from repo root"
            exit 1
          fi
          cp google-services.json android/app/google-services.json
          echo "google-services.json copied OK" >> $GITHUB_STEP_SUMMARY

      - name: Patch Android (permissions)
        run: node scripts/patch-android.js

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
