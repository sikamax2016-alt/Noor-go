<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1D5FE0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="نور جو">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noor Go – نور جو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5FA;--card:#fff;--ink:#0F1A3A;--mute:#5C6785;--blue:#1D5FE0;--blue2:#E6EEFD;--line:#E1E6F0;--fld:#E8EBF2;--yel:#F7B500;--gold:#FFF3CF;--tint:#EEF3FE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1124;--card:#141C36;--ink:#EEF2FF;--mute:#9AA6C8;--blue:#5B8DFF;--blue2:#1B2B55;--line:#25305A;--fld:#1C2644;--gold:#3A3010;--tint:#18233F}}
:root[data-theme="dark"]{--bg:#0B1124;--card:#141C36;--ink:#EEF2FF;--mute:#9AA6C8;--blue:#5B8DFF;--blue2:#1B2B55;--line:#25305A;--fld:#1C2644;--gold:#3A3010;--tint:#18233F}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center}
button{font-family:inherit;color:var(--ink);cursor:pointer}button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
#app{width:100%;max-width:430px;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden}
.sc{flex:1;overflow:auto;padding:14px 16px 14px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lg{display:flex;align-items:center;gap:8px;color:var(--blue);font-weight:800;font-size:32px;margin-inline-end:auto;line-height:1}
.pill,.av{height:42px;border-radius:21px;border:2px solid var(--blue);background:none;color:var(--blue);font:800 14px Cairo;padding:0 14px}
.av{width:42px;padding:0;font-size:18px}
.fd{display:flex;align-items:center;gap:10px;background:var(--fld);border-radius:14px;padding:14px;margin-bottom:8px;font-size:16px;color:var(--mute)}.fd b{color:var(--ink);font-weight:600}
h2{font-size:24px;margin:16px 0 12px;font-weight:800}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cd{background:var(--card);border:2.5px solid transparent;border-radius:22px;padding:14px;text-align:start;box-shadow:0 2px 10px #1a2a5518;display:flex;flex-direction:column;min-height:196px}
.cd[aria-pressed="true"]{border-color:var(--blue)}
.cd b{font-size:19px;font-weight:800}.cd small{color:var(--mute);font-size:12px}
.cd .im{flex:1;display:grid;place-items:center;font-size:62px;margin:2px 0;background:radial-gradient(closest-side,var(--tint),transparent)}
.cd .pr{font-weight:800;font-size:16px}.im img{width:100%;height:104px;object-fit:contain;display:block}.cd .im{background:#fff;border-radius:14px;overflow:hidden}
.cf{width:100%;border:0;border-radius:30px;background:var(--blue);color:#fff;font:800 18px Cairo;padding:16px;margin:14px 0 4px;box-shadow:0 6px 16px #1d5fe044}
.nav{display:flex;background:var(--card);margin:0 10px 10px;border-radius:24px;padding:6px;box-shadow:0 2px 14px #1a2a5522}
.nav button{flex:1;border:0;background:none;border-radius:18px;padding:7px 0;font:600 12px Cairo;color:var(--mute);display:flex;flex-direction:column;align-items:center}.nav span{font-size:22px}
.nav button[aria-current="page"]{color:var(--blue);background:var(--blue2)}
.li{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;width:100%;border:0;text-align:start;box-shadow:0 2px 10px #1a2a5512}
.li .ic{font-size:28px;width:42px;text-align:center}.li b{display:block;font-size:15px}.li small{color:var(--mute);font-size:12px}.li .p{margin-inline-start:auto;font-weight:800;color:var(--blue)}
.wl{background:linear-gradient(135deg,var(--blue),#0E3A9A);color:#fff;border-radius:24px;padding:22px;margin-bottom:14px}.wl small{opacity:.85}.wl b{display:block;font-size:36px}
.ov{position:absolute;inset:0;z-index:5;background:#cfd8ea;overflow:hidden}
.ov svg{position:absolute;inset:0;width:100%;height:100%}
.sh{position:absolute;bottom:0;inset-inline:0;background:var(--card);border-radius:26px 26px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 20px #0003}
.sh h3{margin:0 0 10px;font-size:20px}
.dr{display:flex;gap:12px;align-items:center;margin-bottom:6px}.dr .a{width:52px;height:52px;border-radius:50%;background:var(--yel);color:#2A1D00;display:grid;place-items:center;font:800 22px Cairo}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;width:0;background:var(--blue);animation:f 2.4s linear forwards}@keyframes f{to{width:100%}}
.rw{display:flex;gap:8px}.gh{flex:1;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px;font:800 15px Cairo}
.st{display:flex;justify-content:center;direction:ltr}.st button{background:none;border:0;font-size:38px;color:var(--line)}.st .on{color:var(--yel)}
.tt{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:20px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:13px;text-align:center;z-index:9}
@media (prefers-reduced-motion:reduce){.bar i{animation-duration:.01s}}

.ib{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);font-size:19px;box-shadow:0 1px 6px #0002;flex:none}
.in{width:100%;background:var(--fld);border:2px solid var(--line);border-radius:14px;padding:14px;font:600 17px Cairo;color:var(--ink);margin:6px 0 14px}.in:focus{border-color:var(--blue);outline:0}
label{font-size:14px;color:var(--mute);font-weight:600}.or{text-align:center;color:var(--mute);margin:12px 0}.bd{background:var(--blue);color:#fff;border-radius:10px;padding:2px 10px;font-size:12px;font-weight:800}
.tg{width:52px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;flex:none}.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.tg[aria-pressed="true"]{background:var(--blue)}.tg[aria-pressed="true"]::after{inset-inline-start:25px}
.th{width:64px;height:54px;border-radius:12px;object-fit:contain;background:#fff;flex:none}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px;background:var(--card);border-radius:18px;padding:12px}.bars i{flex:1;background:var(--blue2);border-radius:6px}.bars i:last-child{background:var(--blue)}
.row2{display:flex;gap:10px;margin-bottom:10px}.row2>*{flex:1}
.stat{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 2px 10px #1a2a5512}.stat small{color:var(--mute);display:block;font-size:12px}.stat b{font-size:22px}
.kv{display:flex;justify-content:space-between;padding:5px 0;font-size:15px}.kv span{color:var(--mute)}.kv b{font-size:16px}
.ta{min-height:76px;resize:none;margin:10px 0}
.rd{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px;width:100%;text-align:start;font:600 15px Cairo}.rd[aria-pressed="true"]{border-color:var(--blue)}.rd i{margin-inline-start:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}.rd[aria-pressed="true"] i{border:7px solid var(--blue)}
.ok{background:linear-gradient(120deg,#1DB36A,var(--blue));color:#fff;border-radius:20px;padding:14px;text-align:center;margin-bottom:12px}
h3{font-size:18px;margin:14px 0 8px}
.li .ic{font-size:26px;width:42px;text-align:center}.li .th{margin-inline-end:0}
.dots{display:flex;gap:8px;justify-content:center;margin:12px 0}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots .on{background:var(--blue)}
.bub{max-width:78%;padding:12px 14px;border-radius:18px;margin:8px 0;font-size:15px}.bub.in{background:var(--fld);border-end-start-radius:4px}.bub.out{background:var(--blue);color:#fff;margin-inline-start:auto;border-end-end-radius:4px}.msgs{padding:8px 0;min-height:200px}.send{display:flex;gap:8px;align-items:center}
.bd2{border-radius:10px;padding:2px 10px;font-size:12px;font-weight:800;flex:none}.bd2.on{background:#BFF2D8;color:#0B6B3D}.bd2.ride{background:#FCE7A6;color:#7A5200}.bd2.off{background:var(--line);color:var(--mute)}
.mapc{position:relative;height:150px;border-radius:18px;overflow:hidden}.mapc svg{width:100%;height:100%;display:block}.chip{position:absolute;top:10px;inset-inline-end:10px;background:var(--blue);color:#fff;border-radius:10px;padding:4px 10px;font-size:12px;font-weight:800}
.wm{display:flex;flex-direction:column;font-family:Lalezar,Cairo,sans-serif;font-weight:400;font-size:38px;line-height:1.05}.wm small{font:700 10px Cairo,sans-serif;letter-spacing:4px;color:var(--mute);margin-top:2px;direction:ltr}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}.chp{flex:none;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px;font:600 13px Cairo,sans-serif;color:var(--ink);cursor:pointer}.chp[aria-pressed="true"]{border-color:var(--blue);background:var(--blue2);color:var(--blue)}
.sr{display:flex;gap:8px;margin:8px 0 4px;align-items:center}.sr .in{flex:1;margin:0}
.g .cd:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 6px)}
.mp{position:relative;height:56vh;min-height:300px;border-radius:18px;overflow:hidden;background:#E6EAF2;touch-action:none;margin:8px 0;cursor:grab;direction:ltr}
#mpt{position:absolute;inset:0}
.mt{position:absolute;left:0;top:0;width:256px;height:256px;max-width:none;object-fit:fill;user-select:none;-webkit-user-drag:none}
.mpin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:36px;line-height:1;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.mpz{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mpz button{width:42px;height:42px;border-radius:12px;border:0;background:#fff;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer}
.mpa{position:absolute;bottom:3px;right:6px;font-size:10px;background:rgba(255,255,255,.85);padding:1px 5px;border-radius:4px}
.lbl{font-weight:800;font-size:14px;color:var(--mute);margin:12px 2px 6px}
</style>
</head>
